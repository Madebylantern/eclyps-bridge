[profile.default]
src = "src"
test = "test"
out = "out"
libs = ["lib"]
# Matches Aztec's l1-contracts (solc 0.8.30, prague) so S2 can share interfaces.
solc_version = "0.8.30"
evm_version = "prague"
optimizer = true
optimizer_runs = 200
fs_permissions = [
    # read-write: ExitBatchFork.t.sol rewrites its fixture when ECLYPS_WRITE_FIXTURES=true.
    { access = "read-write", path = "./test/fixtures" },
    { access = "read", path = "../../circuits/vectors" },
    { access = "read", path = "../../sdk/test/fixtures" },
]

[rpc_endpoints]
sepolia = "${SEPOLIA_RPC_URL}"

[fmt]
line_length = 100

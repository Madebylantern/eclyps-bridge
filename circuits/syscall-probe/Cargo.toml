[package]
name = "eclyps-syscall-probe"
version = "0.1.0"
description = "SBF probe: computes batch Merkle roots with the sol_poseidon syscall (S3)"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib", "lib"]

[dependencies]
eclyps-merkle = { path = "../merkle-rs" }
solana-account-info = "3"
solana-cpi = "3"
solana-program-entrypoint = "3"
solana-program-error = "3"
solana-pubkey = "3"

[dev-dependencies]
litesvm = "=0.18.0"
serde_json = "1"
solana-address = "~2.7"
solana-instruction = "~3.5"
solana-keypair = "3.1"
solana-message = "4.5"
solana-signer = "3"
solana-transaction = "4.1"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }

[features]
no-entrypoint = []
custom-heap = []
custom-panic = []
